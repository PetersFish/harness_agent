[project]
name = "smolagent"
version = "0.1.0"
description = "smolagents learning subproject"
requires-python = ">=3.11"
dependencies = [
    "smolagents[openai]",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "ipykernel",
    "jupyterlab",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smolagent"]